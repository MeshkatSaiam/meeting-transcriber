name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'main.py'
      - 'mobile_gui.py'
      - 'transcribe.py'
      - 'buildozer.spec'
      - '.github/workflows/build-android.yml'
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Buildozer Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Buildozer Global Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            ccache

      - name: Install Buildozer & Dependencies
        run: |
          python -m pip install --upgrade "pip<25.0" setuptools wheel
          pip install --upgrade buildozer cython virtualenv

      - name: Build Android Debug APK
        run: |
          buildozer android debug
          # Copy to a clean standard name for direct download
          mkdir -p release_bin
          cp bin/*.apk release_bin/meeting-transcriber-latest.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: meeting-transcriber-debug-apk
          path: release_bin/*.apk
          retention-days: 14

      - name: Publish Latest Dev Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-dev
          name: "Meeting Transcriber (Latest Dev APK)"
          body: |
            ### 📱 Latest Android Build
            - Commit: `${{ github.sha }}`
            - Built automatically from `${{ github.ref_name }}` branch.
            - Direct Download: [meeting-transcriber-latest.apk](https://github.com/${{ github.repository }}/releases/download/latest-dev/meeting-transcriber-latest.apk)
          files: release_bin/meeting-transcriber-latest.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Scan-to-Install QR Code
        run: |
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/latest-dev/meeting-transcriber-latest.apk"
          QR_URL="https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=${DOWNLOAD_URL}"
          
          echo "## 📱 Scan to Install on Android Phone" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Point your phone camera at the QR code below to download and install the APK directly:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "![$DOWNLOAD_URL]($QR_URL)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Or tap here on your phone: [Direct APK Download Link]($DOWNLOAD_URL)" >> $GITHUB_STEP_SUMMARY
